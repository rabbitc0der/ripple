services:
  falkordb:
    image: falkordb/falkordb:latest
    container_name: ripple-falkordb
    ports:
      - "6379:6379"  # FalkorDB Graph Engine (RESP/Redis protocol)
      - "3000:3000"  # FalkorDB Browser (Interactive Web UI for visual graph inspection)
    volumes:
      - falkordb_data:/var/lib/falkordb/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  falkordb_data:
    driver: local
